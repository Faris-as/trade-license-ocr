[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-license-ocr"
version = "1.0.0"
description = "AI-powered structured data extraction from Abu Dhabi trade licenses (YOLOv8 + EasyOCR + FastAPI)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Faris-as" }]
requires-python = ">=3.10,<3.12"

# single source of truth; pins match numpy/torch wheel availability (see requires-python)
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "python-multipart==0.0.7",
    "python-dotenv==1.0.0",
    "torch==2.1.0",
    "torchvision==0.16.0",
    "ultralytics==8.0.196",
    "Pillow==10.2.0",
    "opencv-python==4.8.1.78",
    "numpy==1.24.3",
    "easyocr==1.7.0",
    "PyMuPDF==1.24.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
